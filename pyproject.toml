[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/de_school"]

[project]
name = "data-engineering-school"
version = "0.1.0"
description = "A small collaborative data engineering learning project"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.3,<2",
  "pyarrow>=20,<21",
]

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
